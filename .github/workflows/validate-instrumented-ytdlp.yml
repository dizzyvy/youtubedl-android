name: Validate instrumented yt-dlp runtime

on:
  push:
    paths:
      - ".github/workflows/validate-instrumented-ytdlp.yml"
      - "library/src/main/java/com/yausername/youtubedl_android/**"
      - "library/src/main/res/raw/ytdlp_instrumented"
      - "tools/Build-RiftInstrumentedYtDlp.ps1"
      - "tools/validate-instrumented-ytdlp.py"
  pull_request:
    paths:
      - ".github/workflows/validate-instrumented-ytdlp.yml"
      - "library/src/main/java/com/yausername/youtubedl_android/**"
      - "library/src/main/res/raw/ytdlp_instrumented"
      - "tools/Build-RiftInstrumentedYtDlp.ps1"
      - "tools/validate-instrumented-ytdlp.py"

permissions:
  contents: read

jobs:
  validate-embedded-python:
    name: Validate embedded Python source
    runs-on: ubuntu-latest
    steps:
      - name: Check out wrapper source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile generated runtime and validate timing protocol
        run: python tools/validate-instrumented-ytdlp.py
